<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Каталог — VPHO</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #f5f0ff;
            font-family: 'Montserrat', sans-serif;
            color: #1e1b4b;
            min-height: 100vh;
            padding: 30px 20px;
        }
        .container { max-width: 1100px; margin: 0 auto; }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 30px;
            background: #fff;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(124, 58, 237, 0.08);
            margin-bottom: 30px;
            flex-wrap: wrap;
            gap: 15px;
        }
        .logo {
            font-size: 32px;
            font-weight: 900;
            color: #5b21b6;
            text-decoration: none;
        }
        .logo i { color: #7c3aed; margin-right: 10px; }
        .nav a {
            color: #4b3a6b;
            text-decoration: none;
            margin-left: 25px;
            font-weight: 700;
            font-size: 15px;
            transition: color 0.3s;
        }
        .nav a:hover { color: #7c3aed; }
        .nav a.active { color: #7c3aed; border-bottom: 3px solid #7c3aed; padding-bottom: 5px; }

        .page-title {
            font-size: 36px;
            font-weight: 900;
            color: #5b21b6;
            text-align: center;
            margin-bottom: 10px;
        }
        .page-sub {
            text-align: center;
            color: #6d28d9;
            font-size: 16px;
            margin-bottom: 30px;
            opacity: 0.8;
        }

        .catalog-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 30px;
            margin-bottom: 30px;
        }
        .product-card {
            background: #fff;
            border-radius: 24px;
            padding: 30px 25px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(124, 58, 237, 0.08);
            transition: 0.3s;
            border: 1px solid rgba(124, 58, 237, 0.05);
        }
        .product-card:hover { 
            transform: translateY(-8px); 
            box-shadow: 0 25px 50px rgba(124, 58, 237, 0.15);
        }
        .product-card .icon-wrap {
            font-size: 55px;
            color: #7c3aed;
            margin-bottom: 15px;
            background: #f5f0ff;
            width: 80px;
            height: 80px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-left: auto;
            margin-right: auto;
        }
        .product-card h3 {
            font-size: 28px;
            font-weight: 900;
            color: #5b21b6;
            letter-spacing: 2px;
        }
        .product-card .subname {
            font-size: 14px;
            color: #6d28d9;
            opacity: 0.7;
            margin-bottom: 15px;
        }
        .product-card .prices {
            display: flex;
            justify-content: center;
            gap: 15px;
            flex-wrap: wrap;
            margin: 15px 0;
        }
        .product-card .prices .price-item {
            background: #f5f0ff;
            padding: 6px 14px;
            border-radius: 30px;
            font-size: 14px;
            font-weight: 700;
            color: #5b21b6;
        }
        .product-card .prices .price-item span {
            font-size: 16px;
        }
        .product-card .btn-buy {
            padding: 12px 40px;
            background: #7c3aed;
            color: #fff;
            border: none;
            border-radius: 50px;
            font-weight: 700;
            cursor: pointer;
            transition: 0.3s;
            font-size: 16px;
            margin-top: 10px;
            box-shadow: 0 0 20px rgba(124, 58, 237, 0.2);
        }
        .product-card .btn-buy:hover { 
            background: #5b21b6; 
            transform: scale(1.05);
        }
        .badge-new {
            background: #7c3aed;
            color: #fff;
            font-size: 11px;
            padding: 3px 14px;
            border-radius: 50px;
            display: inline-block;
            margin-top: 5px;
            font-weight: 700;
            letter-spacing: 1px;
        }

        .back-btn {
            display: inline-block;
            padding: 12px 30px;
            background: transparent;
            color: #7c3aed;
            border: 2px solid #7c3aed;
            border-radius: 50px;
            text-decoration: none;
            font-weight: 700;
            transition: 0.3s;
        }

<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вход — VPHO</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #f5f0ff;
            font-family: 'Montserrat', sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .card {
            background: #fff;
            border-radius: 30px;
            padding: 50px 40px;
            max-width: 450px;
            width: 100%;
            box-shadow: 0 20px 60px rgba(124, 58, 237, 0.15);
            text-align: center;
        }
        .card .logo {
            font-size: 40px;
            font-weight: 900;
            color: #5b21b6;
        }
        .card .logo i { color: #7c3aed; margin-right: 10px; }
        .card h2 {
            font-size: 28px;
            color: #1e1b4b;
            margin: 20px 0 8px;
        }
        .card p.sub {
            color: #6d28d9;
            font-size: 14px;
            margin-bottom: 30px;
        }
        .form-group {
            text-align: left;
            margin-bottom: 20px;
        }
        .form-group label {
            font-weight: 700;
            color: #1e1b4b;
            font-size: 14px;
            display: block;
            margin-bottom: 6px;
        }
        .form-group input {
            width: 100%;
            padding: 14px 18px;
            border: 2px solid #e5e0f0;
            border-radius: 12px;
            font-size: 16px;
            font-family: 'Montserrat', sans-serif;
            transition: 0.3s;
            background: #faf8ff;
        }
        .form-group input:focus {
            border-color: #7c3aed;
            outline: none;
            box-shadow: 0 0 0 4px rgba(124, 58, 237, 0.1);
        }
        .row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 14px;
            color: #4b3a6b;
            margin: 15px 0 25px;
        }
        .row label { display: flex; align-items: center; gap: 8px; cursor: pointer; }
        .row input { accent-color: #7c3aed; width: 18px; height: 18px; }
        .row a { color: #7c3aed; text-decoration: none; font-weight: 700; }
        .row a:hover { text-decoration: underline; }
        .btn {
            width: 100%;
            padding: 16px;
            border: none;
            border-radius: 50px;
            font-weight: 700;
            font-size: 18px;
            cursor: pointer;
            transition: 0.3s;
            background: #7c3aed;
            color: #fff;
            box-shadow: 0 0 20px rgba(124, 58, 237, 0.3);
        }
        .btn:hover { background: #5b21b6; transform: scale(1.02); }
        .card .link {
            display: block;
            margin-top: 20px;
            color: #7c3aed;
            text-decoration: none;
            font-weight: 700;
            font-size: 14px;
        }
        .card .link:hover { text-decoration: underline; }
        .back-btn {
            display: inline-block;
            margin-top: 15px;
            color: #6d28d9;
            text-decoration: none;
            font-size: 14px;
        }
        .back-btn:hover { text-decoration: underline; }
    </style>
</head>
<body>
    <div class="card">
        <div class="logo"><i class="fas fa-cog"></i> VPHO</div>
        <h2>Добро пожаловать</h2>
        <p class="sub">Пожалуйста, войдите в свой аккаунт</p>

        <form id="loginForm" action="dashboard.html">
            <div class="form-group">
                <label>Почта или Логин</label>
                <input type="text" id="loginUsername" placeholder="Введите логин или почту" required>
            </div>
            <div class="form-group">
                <label>Пароль</label>
                <input type="password" placeholder="••••••••" required>
            </div>
            <div class="row">
                <label><input type="checkbox"> Запомнить меня</label>
                <a href="#">Забыли пароль?</a>
            </div>
            <button type="submit" class="btn">Войти</button>
        </form>

        <a href="register.html" class="link">Нет аккаунта? Зарегистрироваться</a>
        <a href="index.html" class="back-btn"><i class="fas fa-arrow-left"></i> На главную</a>
    </div>

    <script>
        document.getElementById('loginForm').addEventListener('submit', function(e) {
            const username = document.getElementById('loginUsername').value.trim();
            if (username) {
                localStorage.setItem('vpho_username', username);
            }
        });
    </script>
</body>
</html>
